minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
# Exact security fixes verified against the upstream advisories.
minimumReleaseAgeExclude:
  - fast-uri@3.1.9
  - undici@8.12.2
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  tesseract.js: false
  unrs-resolver: true
# Security floors for optional transitive peers retained by pnpm's resolver.
overrides:
  # GHSA-g3hv-75wg-m249. The installed v10 consumers use minimatch()/Minimatch.match(),
  # which v11 retains; do not override older majors with a different API.
  'minimatch@>=10.0.0 <11.0.1': 11.0.1
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9

  'undici@>=8.0.0 <8.12.2': 8.12.2

