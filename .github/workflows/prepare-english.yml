name: Prepare English copy for review
on:
  push:
    branches: [i18n/complete-english]
    paths: [translation-work/**, .github/workflows/prepare-english.yml]
permissions:
  contents: read
jobs:
  draft-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Translate public application copy with the existing local engine
        run: |
          mkdir -p translation-output
          chmod 777 translation-output
          docker run --rm --entrypoint /app/venv/bin/python \
            -e ARGOS_CHUNK_TYPE=MINISBD \
            -v "$PWD:/repo:ro" -v "$PWD/translation-output:/out" \
            libretranslate/libretranslate:v1.8.4 /repo/translation-work/translate-catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: english-copy-draft
          path: translation-output/
          retention-days: 3
