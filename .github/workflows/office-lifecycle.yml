name: Office worker lifecycle investigation
on:
  push:
    branches: [investigate/office-worker-shutdown]
    paths:
      - '.github/workflows/office-lifecycle.yml'
      - 'tests/browser-office-browser.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  published-office:
    name: Published Office (${{ matrix.channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        channel: [headless-shell, chromium]
    steps:
      - uses: actions/checkout@v7
      - name: Install the original test browser and fixture tools
        run: |
          python -m pip install playwright==1.55.0 pymupdf==1.28.2 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Start the unchanged published 0.14.4 image
        run: |
          docker run -d --name office-lifecycle -p 127.0.0.1:8080:8080 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e MOINPDF_API_KEY=synthetic-office-lifecycle-key-00000000 \
            ghcr.io/moinpdf/moinpdf-web@sha256:03216311bf55ef0571e1071739ecb96974b6be09a487fa51327bfd6acbf3df2b
          curl --fail --retry 30 --retry-all-errors --retry-delay 1 http://localhost:8080/ -o /dev/null
      - name: Convert, cancel and restart with worker lifecycle evidence
        env:
          MOINPDF_TEST_URL: http://localhost:8080
          MOINPDF_OFFICE_CYCLES: '30'
          MOINPDF_BROWSER_CHANNEL: ${{ matrix.channel == 'chromium' && 'chromium' || '' }}
        run: python tests/browser-office-browser.py
      - name: Retain lifecycle evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-lifecycle-${{ matrix.channel }}
          path: web-evidence/
          retention-days: 14
      - name: Cleanup
        if: always()
        run: docker rm -f office-lifecycle || true
