name: Complete Docker installation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website rendering and network isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the isolated website converter
        run: docker build --target test -t moinpdf-website-tests ./docker/website
      - name: Real Chromium PDFs, redirects, private networks and request limits
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:mode=1777,size=512m \
            --cap-drop ALL --security-opt no-new-privileges --memory 1g --pids-limit 256 \
            --volume "$PWD/docker/website:/repo:ro" --workdir /repo moinpdf-website-tests \
            python -m unittest discover -s . -p 'test_*.py' -v
  local-model:
    name: Local model in production browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the production web image
        run: |
          docker build -t moinpdf-model-test .
          docker run -d --name moinpdf-model-test -p 8080:8080 \
            -e MOINPDF_API_KEY=synthetic-local-model-test-key-00000000 moinpdf-model-test
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:8080/ -o /dev/null
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.55.0 pymupdf==1.28.2 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Document creation, drafts and result actions over local HTTP
        env:
          MOINPDF_TEST_URL: http://localhost:8080
          MOINPDF_TEST_NONLOCAL_HTTP: "1"
        run: python tests/release-usability-browser.py
      - name: Complex text and nested PDF editor in production
        env:
          MOINPDF_TEST_URL: http://localhost:8080
          MOINPDF_TEST_NONLOCAL_HTTP: "1"
        run: python tests/native-editor-browser.py
      - name: XFA data editing and packet preservation
        env:
          MOINPDF_TEST_URL: http://localhost:8080
        run: python tests/xfa-browser.py
      - name: Real local Office conversion without document uploads
        id: office
        env:
          MOINPDF_TEST_URL: http://localhost:8080
        run: python tests/browser-office-browser.py
      - name: Diagnose a failed Office conversion with synthetic fixtures
        if: failure() && steps.office.outcome == 'failure'
        timeout-minutes: 5
        env:
          MOINPDF_TEST_URL: http://localhost:8080
          MOINPDF_OFFICE_VERBOSE: "1"
        run: python tests/browser-office-browser.py
      - name: Real local language model with offline document questions
        env:
          MOINPDF_TEST_URL: http://localhost:8080
        run: python tests/local-assistant-browser.py
      - name: Retain local model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-model-verification
          path: web-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker logs --tail 50 moinpdf-model-test || true
          docker rm -f moinpdf-model-test || true
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Audit pinned document-server dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps -r server/requirements.lock.txt
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          MOINPDF_DOMAIN=pdf.example.org docker compose -f compose.yaml -f compose.https.yaml config --quiet
      - name: Build all services
        id: build
        run: docker compose build
      - name: Browser engine and TypeScript checks
        run: |
          docker build --target build -t moinpdf-browser-tests .
          docker run --rm moinpdf-browser-tests pnpm audit
          docker run --rm moinpdf-browser-tests pnpm run lint
          docker run --rm moinpdf-browser-tests pnpm run format:check
          docker run --rm moinpdf-browser-tests pnpm test
          docker run --rm moinpdf-browser-tests node tests/release-workflow-smoke.mjs
      - name: Native document converters and key-file authentication
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tests/fetch-office-fixtures.py
          docker build --target test -t moinpdf-document-tests ./server
          docker run --rm --network none --read-only --tmpfs /tmp:mode=1777,size=1g \
            --volume "$PWD:/repo:ro" --workdir /repo moinpdf-document-tests \
            python -m unittest server.test_service server.test_expansion server.test_extended_documents server.test_key_file server.test_translation_ready server.test_recovery server.test_audio server.test_accessible server.test_expansion_documents server.test_tags server.test_signatures server.test_import_formats server.test_upload_security -v
      - name: Start complete stack with all seven languages
        id: start
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker compose up -d --wait --wait-timeout 1800
      - name: Real HTTP proxy, assets, Office and PDF translation
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          docker compose exec -T documents python -c "import urllib.request; print('Document server is running')"
          docker compose run --rm --no-deps --volume "$PWD:/repo:ro" documents python /repo/tests/selfhost-smoke.py
      - name: Models and credentials survive a restart
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          docker compose stop
          docker compose up -d --wait --wait-timeout 180
          docker compose run --rm --no-deps --volume "$PWD:/repo:ro" documents python /repo/tests/selfhost-smoke.py
      - name: Install browser test runtime
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          python -m pip install playwright==1.55.0 pymupdf==1.28.2
          python -m playwright install --with-deps chromium
      - name: All tool views, desktop and mobile, PDF and audio downloads
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        env:
          MOINPDF_TEST_URL: http://localhost:8080
          MOINPDF_REQUIRE_SERVER: "1"
          MOINPDF_TEST_NONLOCAL_HTTP: "1"
        run: |
          status=0
          for test in xfa-browser published-web-smoke hafenlicht-browser harbor-layout-browser website-browser; do
            python "tests/$test.py" || status=1
          done
          for test in language-smoke documentation-smoke; do
            MOINPDF_DOCUMENTATION_URL=http://localhost:8080 python "tests/$test.py" || status=1
          done
          exit "$status"
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-ui-verification
          path: |
            web-evidence/
            documentation-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Optional login protects the app and API
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        env:
          MOINPDF_PASSWORD: synthetic-ci-password
        run: |
          docker compose up -d --wait --wait-timeout 180 app
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-MoinPDF-Client: web' http://localhost:8080/api/documents/v1/capabilities)" = 401
          docker compose run --rm --no-deps --volume "$PWD:/repo:ro" \
            --env MOINPDF_TEST_PASSWORD=synthetic-ci-password documents python /repo/tests/selfhost-smoke.py
      - name: Diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150
      - name: Cleanup
        if: always()
        run: docker compose down -v
