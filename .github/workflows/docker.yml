name: Complete Docker installation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-model:
    name: Local model in production browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the production web image
        run: |
          docker build -t moinpdf-model-test .
          docker run -d --name moinpdf-model-test -p 8080:8080 \
            -e MOINPDF_API_KEY=synthetic-local-model-test-key-00000000 moinpdf-model-test
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:8080/ -o /dev/null
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.55.0 pymupdf==1.28.2
          python -m playwright install --with-deps chromium
      - name: Real local language model with offline document questions
        env:
          MOINPDF_TEST_URL: http://localhost:8080
        run: python tests/local-assistant-browser.py
      - name: Retain local model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-model-verification
          path: web-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker logs --tail 50 moinpdf-model-test || true
          docker rm -f moinpdf-model-test || true
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          MOINPDF_DOMAIN=pdf.example.org docker compose -f compose.yaml -f compose.https.yaml config --quiet
      - name: Build all services
        id: build
        run: docker compose build
      - name: Browser engine and TypeScript checks
        run: |
          docker build --target build -t moinpdf-browser-tests .
          docker run --rm moinpdf-browser-tests pnpm run lint
          docker run --rm moinpdf-browser-tests pnpm run format:check
          docker run --rm moinpdf-browser-tests pnpm test
      - name: Native document converters and key-file authentication
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tests/fetch-office-fixtures.py
          docker build --target test -t moinpdf-document-tests ./server
          docker run --rm --network none --read-only --tmpfs /tmp:mode=1777,size=1g \
            --volume "$PWD:/repo:ro" --workdir /repo moinpdf-document-tests \
            python -m unittest server.test_service server.test_expansion server.test_extended_documents server.test_key_file server.test_translation_ready server.test_recovery server.test_audio server.test_accessible server.test_expansion_documents server.test_tags server.test_signatures server.test_import_formats -v
      - name: Start complete stack with all seven languages
        id: start
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker compose up -d --wait --wait-timeout 1800
      - name: Real HTTP proxy, assets, Office and PDF translation
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          docker compose exec -T documents python -c "import urllib.request; print('Document server is running')"
          docker compose run --rm --no-deps --volume "$PWD:/repo:ro" documents python /repo/tests/selfhost-smoke.py
      - name: Models and credentials survive a restart
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          docker compose stop
          docker compose up -d --wait --wait-timeout 180
          docker compose run --rm --no-deps --volume "$PWD:/repo:ro" documents python /repo/tests/selfhost-smoke.py
      - name: Install browser test runtime
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: |
          python -m pip install playwright==1.55.0 pymupdf==1.28.2
          python -m playwright install --with-deps chromium
      - name: All tool views, desktop and mobile, PDF and audio downloads
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        env:
          MOINPDF_TEST_URL: http://localhost:8080
          MOINPDF_REQUIRE_SERVER: "1"
          MOINPDF_TEST_NONLOCAL_HTTP: "1"
        run: |
          python tests/published-web-smoke.py
          MOINPDF_DOCUMENTATION_URL=http://localhost:8080 python tests/documentation-smoke.py
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-ui-verification
          path: |
            web-evidence/
            documentation-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Optional login protects the app and API
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        env:
          MOINPDF_PASSWORD: synthetic-ci-password
        run: |
          docker compose up -d --wait --wait-timeout 180 app
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-MoinPDF-Client: web' http://localhost:8080/api/documents/v1/capabilities)" = 401
          docker compose run --rm --no-deps --volume "$PWD:/repo:ro" \
            --env MOINPDF_TEST_PASSWORD=synthetic-ci-password documents python /repo/tests/selfhost-smoke.py
      - name: Diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 150
      - name: Cleanup
        if: always()
        run: docker compose down -v
