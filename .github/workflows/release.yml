name: Publish verified release
on:
  workflow_run:
    workflows: [Publish Docker images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_run_id:
        description: Successful Publish Docker images run ID
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.image_run_id }}
          pattern: docker-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/image-reference
      - name: Verify tests, exact image source and release version
        id: verify
        uses: actions/github-script@v7
        env:
          IMAGE_RUN_ID: ${{ github.event.workflow_run.id || inputs.image_run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid version');
            const runId = Number(process.env.IMAGE_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('Invalid image run');
            const {data: imageRun} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            if (imageRun.path !== '.github/workflows/publish-images.yml' || imageRun.conclusion !== 'success' || imageRun.head_branch !== 'main' || imageRun.repository.full_name !== context.repo.owner + '/' + context.repo.repo || !['workflow_run', 'workflow_dispatch'].includes(imageRun.event)) throw new Error('Images must come from the successful image workflow');
            const names = ['web', 'documents', 'translation', 'website'];
            const refs = names.map(name => JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'image-reference', name + '.json'), 'utf8')));
            const source = refs[0].source;
            if (!/^[0-9a-f]{40}$/.test(source) || refs.some(ref => ref.source !== source)) throw new Error('Mixed image sources');
            if (source !== context.sha) throw new Error('Release source must exactly match the tested image source');
            for (let index = 0; index < refs.length; index++) {
              const ref = refs[index];
              const prefix = `ghcr.io/${context.repo.owner.toLowerCase()}/moinpdf-${names[index]}:${version}-${source.slice(0, 12)}`;
              if (ref.image !== prefix || !/^sha256:[0-9a-f]{64}$/.test(ref.digest) || JSON.stringify(ref.platforms) !== JSON.stringify(['linux/amd64', 'linux/arm64'])) throw new Error('Image reference must match this release version and both platforms');
            }
            const verificationRun = refs[0].verificationRun;
            if (!Number.isSafeInteger(verificationRun) || verificationRun <= 0 || refs.some(ref => ref.verificationRun !== verificationRun)) throw new Error('Mixed or missing Docker verification runs');
            const {data: dockerRun} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: verificationRun});
            const repository = context.repo.owner + '/' + context.repo.repo;
            if (dockerRun.path !== '.github/workflows/docker.yml' || dockerRun.status !== 'completed' || dockerRun.conclusion !== 'success' || dockerRun.head_sha !== source || dockerRun.head_branch !== 'main' || dockerRun.event !== 'push' || dockerRun.repository?.full_name !== repository || dockerRun.head_repository?.full_name !== repository) throw new Error('Missing successful Docker verification of the release source');
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (main.commit.sha !== source) throw new Error('The tested release source has been superseded on main');
            const heading = `## ${version} `;
            const section = fs.readFileSync('CHANGELOG.md', 'utf8').split(heading)[1];
            if (!section) throw new Error('Missing changelog');
            const notes = section.split('\n').slice(1).join('\n').split('\n## ')[0].trim();
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-notes.md'), notes + '\n\nGeprüfter Quellstand: `' + context.sha + '`\nContainer-Quellstand: `' + source + '`\n');
            core.setOutput('tag', 'v' + version);
      - name: Create the version tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.verify.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This version already has a release; existing releases are not overwritten.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" \
            --title "MoinPDF $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/image-reference/"*.json
