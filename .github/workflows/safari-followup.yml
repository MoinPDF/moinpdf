name: Native Safari follow-up
on:
  push:
    branches: ['qa/safari-followup-0.13.25']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safari-followup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safari:
    name: Native Safari on macOS
    runs-on: macos-15
    timeout-minutes: 25
    env:
      MOINPDF_TEST_URL: http://127.0.0.1:8765
      MOINPDF_SAFARI_CASES: IndexedDB,OCR
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the released application without source changes
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm run build:selfhost
      - name: Prepare Apple Safari WebDriver
        run: |
          python -m pip install selenium pymupdf==1.28.2
          sudo safaridriver --enable
          defaults write com.apple.Safari AutoOpenSafeDownloads -bool false
          mkdir -p cross-browser-evidence
          python -m pip freeze > cross-browser-evidence/runtime.txt
          safaridriver --version > cross-browser-evidence/safaridriver.txt
      - name: Start isolated local production build
        run: |
          python tests/cross-browser-server.py > "$RUNNER_TEMP/cross-browser-http.log" 2>&1 &
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8765/ -o /dev/null
      - name: Real Safari UI and document roundtrips
        run: python tests/safari-native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-native-safari
          path: cross-browser-evidence/
          retention-days: 30
