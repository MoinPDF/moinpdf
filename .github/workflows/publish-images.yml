name: Publish Docker images

on:
  workflow_run:
    workflows: [Complete Docker installation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  verified:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.verify.outputs.source }}
      run_id: ${{ steps.verify.outputs.run_id }}
    steps:
      - name: Require successful complete verification for this exact main commit
        id: verify
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid source commit');
            const repository = context.repo.owner + '/' + context.repo.repo;
            const verified = run => run.path === '.github/workflows/docker.yml'
              && run.status === 'completed' && run.conclusion === 'success'
              && run.head_sha === sha && run.head_branch === 'main' && run.event === 'push'
              && run.repository?.full_name === repository && run.head_repository?.full_name === repository;
            let run;
            if (context.eventName === 'workflow_run') {
              // The list/search index can lag behind the completed webhook. Read
              // the triggering run directly and still validate its exact source.
              const runId = context.payload.workflow_run.id;
              if (!Number.isSafeInteger(runId) || runId <= 0) throw new Error('Invalid verification run');
              ({data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId}));
            } else {
              const {data} = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'docker.yml', head_sha: sha, per_page: 100,
              });
              run = data.workflow_runs.find(verified);
            }
            if (!run || !verified(run)) {
              throw new Error('A successful complete Docker verification on main is required');
            }
            core.setOutput('source', sha);
            core.setOutput('run_id', run.id);
  image:
    needs: verified
    name: ${{ matrix.name }} (amd64 and arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
          - name: documents
            context: ./server
          - name: translation
            context: ./docker/translation
          - name: website
            context: ./docker/website
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verified.outputs.source }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Exact source image tag
        id: tag
        env:
          SOURCE_SHA: ${{ needs.verified.outputs.source }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          image="ghcr.io/${REPOSITORY_OWNER,,}/moinpdf-${IMAGE_NAME}:${version}-${SOURCE_SHA:0:12}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Build and publish both architectures
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: MOINPDF_UID=1000
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verified.outputs.source }}
            org.opencontainers.image.title=MoinPDF ${{ matrix.name }}
          cache-from: type=gha,scope=moinpdf-${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=moinpdf-${{ matrix.name }}
      - name: Verify published platform index and record immutable reference
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
          SOURCE_SHA: ${{ needs.verified.outputs.source }}
          VERIFICATION_RUN_ID: ${{ needs.verified.outputs.run_id }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > index.json
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' index.json
          mkdir -p image-reference
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg source "$SOURCE_SHA" --argjson verificationRun "$VERIFICATION_RUN_ID" '{image:$image,digest:$digest,source:$source,verificationRun:$verificationRun,platforms:["linux/amd64","linux/arm64"]}' > "image-reference/${IMAGE_NAME}.json"
          echo "### ${IMAGE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.name }}
          path: image-reference/
          retention-days: 30
