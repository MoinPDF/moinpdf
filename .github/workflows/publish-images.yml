name: Publish platform images

on:
  push:
    branches: [codex/platform-app]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.name }} (amd64 and arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
          - name: documents
            context: ./server
          - name: translation
            context: ./docker/translation
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Exact source image tag
        id: tag
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          image="ghcr.io/${REPOSITORY_OWNER,,}/moinpdf-${IMAGE_NAME}:${version}-${SOURCE_SHA:0:12}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Build and publish both architectures
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
          build-args: MOINPDF_UID=1000
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=MoinPDF ${{ matrix.name }}
          cache-from: type=gha,scope=platform-${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=platform-${{ matrix.name }}
      - name: Verify published platform index and record immutable reference
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > index.json
          jq -e 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")' index.json
          mkdir -p image-reference
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg source "$GITHUB_SHA" '{image:$image,digest:$digest,source:$source,platforms:["linux/amd64","linux/arm64"]}' > "image-reference/${IMAGE_NAME}.json"
          echo "### ${IMAGE_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-image-${{ matrix.name }}
          path: image-reference/
          retention-days: 30
