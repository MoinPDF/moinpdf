name: Documentation and footer
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'media/**'
      - 'public/media/**'
      - 'public/medienbereich.html'
      - 'scripts/build-media.mjs'
      - 'public/docs/**'
      - 'public/dokumentation.html'
      - 'public/impressum.html'
      - 'public/datenschutz.html'
      - 'public/legal/**'
      - 'components/studio/legal-footer*'
      - 'scripts/build-documentation.mjs'
      - 'lib/tool-catalog.ts'
      - 'package.json'
      - 'tests/documentation-smoke.py'
      - '.github/workflows/documentation.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the actual web application and manual
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm run typecheck:selfhost
          pnpm run build:selfhost
      - name: Install browser verification dependencies
        run: |
          python -m pip install playwright==1.55.0 pymupdf==1.28.2
          python -m playwright install --with-deps chromium
      - name: Verify documentation, mobile layout, printing and retained PDF
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist/selfhost > "$RUNNER_TEMP/docs-http.log" 2>&1 &
          python tests/language-smoke.py
          python tests/documentation-smoke.py
      - name: Retain screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-verification
          path: documentation-evidence/
          if-no-files-found: ignore
          retention-days: 14
