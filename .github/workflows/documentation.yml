name: Documentation and footer
on:
  push:
    branches: [main, rebuild/editor-adaptive-workspace]
    # Every main commit needs this check for exact-source release verification.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the actual web application and manual
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm run typecheck:selfhost
          pnpm run build:selfhost
      - name: Install browser verification dependencies
        timeout-minutes: 8
        run: |
          bash scripts/ci-prepare-apt.sh
          python -m pip install playwright==1.64.0 pymupdf==1.28.2
          python -m playwright install --with-deps chromium
      - name: Verify documentation, mobile layout, printing and retained PDF
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist/selfhost > "$RUNNER_TEMP/docs-http.log" 2>&1 &
          status=0
          for test in hafenlicht-browser harbor-layout-browser language-smoke documentation-smoke accessibility-browser; do
            python "tests/$test.py" || status=1
          done
          exit "$status"
      - name: Prepare downloadable web preview
        if: github.event_name == 'pull_request'
        run: |
          cat > dist/selfhost/PREVIEW-README.txt <<'EOF'
          MoinPDF – testable web build from the pull request
          =================================================
          This package contains the actual production-built MoinPDF frontend.
          No production website, Docker release, or version tag was changed.

          Extract all files. Serve the extracted folder over local HTTP
          (opening index.html via file:// is not sufficient).

          Windows (with Python):  py -m http.server 8765
          macOS/Linux:            python3 -m http.server 8765

          Open http://localhost:8765 in your desktop browser.
          Local PDF tools work in the browser. Features that require the
          optional MoinPDF document server need their own server setup.

          On a 1920px-wide screen the interface should use approximately
          1613px of space, including the upload and quick-access cards.
          Tablet and mobile layouts remain unchanged.
          EOF
      - name: Upload downloadable web preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: moinpdf-web-preview-${{ github.event.pull_request.number }}
          path: dist/selfhost/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-verification
          path: documentation-evidence/
          if-no-files-found: ignore
          retention-days: 14
