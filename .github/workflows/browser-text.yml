name: Browser text compatibility
on:
  push:
    branches: [main, fix/safari-pdf-text]
    paths:
      - 'lib/**'
      - 'tests/*text*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/browser-text.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/**'
      - 'tests/*text*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/browser-text.yml'
permissions:
  contents: read
concurrency:
  group: browser-text-${{ github.ref }}
  cancel-in-progress: true
jobs:
  text:
    name: PDF text in ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: safari
            os: macos-15
          - browser: firefox
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MOINPDF_TEST_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build browser-only application from production source
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm run build:selfhost
          pnpm exec vite build --config tests/vite.browser-text.config.ts
      - name: Prepare native Safari
        if: matrix.browser == 'safari'
        run: |
          python -m pip install selenium pymupdf==1.28.2
          sudo safaridriver --enable
          defaults write com.apple.Safari AutoOpenSafeDownloads -bool false
      - name: Prepare Firefox
        if: matrix.browser == 'firefox'
        run: |
          python -m pip install playwright pymupdf==1.28.2
          python -m playwright install --with-deps firefox
      - name: Start local production build
        run: |
          mkdir -p cross-browser-evidence
          python -m pip freeze > cross-browser-evidence/runtime.txt
          python tests/text-browser-server.py > "$RUNNER_TEMP/text-browser-http.log" 2>&1 &
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8765/ -o /dev/null
      - name: Check text extraction through real UI and independently read outputs
        run: python tests/${{ matrix.browser }}-text-browser.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: text-compatibility-${{ matrix.browser }}
          path: cross-browser-evidence/
          retention-days: 30
