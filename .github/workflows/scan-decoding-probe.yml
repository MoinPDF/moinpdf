name: Isolated scan decoding diagnosis
on:
  push:
    branches: [fix/webkit-scan-rendering]
permissions:
  contents: read
concurrency:
  group: scan-decoding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [default, raw-pixels, bounded-canvas]
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact diagnostic source
        run: |
          mkdir -p .cache/scan-decoding
          git archive --format=zip --output=.cache/scan-decoding/source.zip HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare production build and browser
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm run build:selfhost
          node tests/editor-adaptive-fixtures.mjs
          bash scripts/ci-prepare-apt.sh
          python -m pip install playwright==1.64.0 pymupdf==1.26.6
          python -m playwright install --with-deps webkit
      - name: Exercise unchanged scan edit and export assertions twice
        env:
          MOINPDF_TEST_BROWSERS: webkit
          MOINPDF_TEST_START_SERVER: '1'
          MOINPDF_ADAPTIVE_CASES: high-scan
          MOINPDF_SCAN_PROBE_PROFILE: ${{ matrix.profile }}
        run: |
          status=0
          for attempt in 1 2; do
            MOINPDF_BROWSER_OUTPUT=".cache/scan-decoding/${{ matrix.profile }}/$attempt" python tests/editor-scan-decoding-probe.py || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scan-decoding-${{ matrix.profile }}
          path: .cache/scan-decoding/
          retention-days: 7
