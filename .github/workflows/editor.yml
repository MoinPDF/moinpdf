name: PDF editor preservation
on:
  push:
    branches: [main, fix/pdf-editor-preservation, rebuild/editor-adaptive-workspace]
    # Every main commit needs this check for exact-source release verification.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Editor in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and check editor
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm run typecheck:selfhost
          pnpm run build:selfhost
          node tests/editor-scan-typography-smoke.mjs
          node tests/editor-comparison-smoke.mjs
          node tests/editor-preservation-smoke.mjs
          node tests/editor-rich-smoke.mjs
          node tests/editor-resilience-smoke.mjs
          node tests/release-022-smoke.mjs
          node tests/editor-ui-smoke.mjs
          node tests/editor-workflow-smoke.mjs
          node tests/editor-adaptive-smoke.mjs
          node tests/editor-adaptive-fixtures.mjs
          node tests/pdf-session-smoke.mjs
      - name: Independently produced two-column PDF
        run: |
          mkdir -p .cache/editor-corpus
          curl --fail --location --retry 3 https://raw.githubusercontent.com/mozilla/pdf.js/0d5f92deedb16d3e8b85fc2c6dcf753f572cedd2/test/pdfs/tracemonkey.pdf --output .cache/editor-corpus/tracemonkey.pdf
          echo '3662ff519e485810520552bf301d8c3b2b917fd2f83303f4965d7abed367e113  .cache/editor-corpus/tracemonkey.pdf' | sha256sum --check
          python tests/editor-download-corpus.py
          MOINPDF_EDITOR_CORPUS=.cache/editor-corpus/tracemonkey.pdf node tests/editor-preservation-smoke.mjs
      - name: Prepare browser
        timeout-minutes: 8
        run: |
          bash scripts/ci-prepare-apt.sh
          python -m pip install playwright==1.64.0 pymupdf==1.26.6
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Scan compression, target-size status and wide layouts
        env:
          MOINPDF_TEST_BROWSERS: ${{ matrix.browser }}
          MOINPDF_TEST_START_SERVER: '1'
        run: |
          node tests/scan-compression-smoke.mjs
          python tests/scan-compression-browser.py
      - name: Native redaction, 1000-page output and 81 MiB file-backed input
        env:
          MOINPDF_TEST_BROWSERS: ${{ matrix.browser }}
          MOINPDF_TEST_START_SERVER: '1'
        run: python tests/optimizations-browser.py
      - name: Header and footer cleanup with real PDF downloads
        env:
          MOINPDF_TEST_BROWSERS: ${{ matrix.browser }}
          MOINPDF_TEST_START_SERVER: '1'
        run: python tests/header-footer-browser.py
      - name: Color preview and selective form unlocking with real PDF downloads
        env:
          MOINPDF_TEST_BROWSERS: ${{ matrix.browser }}
          MOINPDF_TEST_START_SERVER: '1'
        run: python tests/color-tools-browser.py
      - name: Form profiles and A4 receipt workflows
        env:
          MOINPDF_TEST_BROWSERS: ${{ matrix.browser }}
          MOINPDF_TEST_START_SERVER: '1'
        run: python tests/everyday-browser.py
      - name: Klar Schiff document review, PDF downloads and audio language
        env:
          MOINPDF_TEST_BROWSERS: ${{ matrix.browser }}
          MOINPDF_TEST_START_SERVER: '1'
        run: python tests/klar-schiff-browser.py
      - name: Edit, undo, export, independently inspect and reopen
        env:
          MOINPDF_TEST_BROWSERS: ${{ matrix.browser }}
          MOINPDF_TEST_START_SERVER: '1'
        run: |
          status=0
          python tests/release-021-browser.py || status=1
          python tests/editor-corpus-check.py || status=1
          python tests/editor-browser.py || status=1
          python tests/editor-quality-browser.py || status=1
          python tests/editor-workflow-browser.py || status=1
          python tests/editor-adaptive-browser.py || status=1
          python tests/word-export-browser.py || status=1
          python tests/editor-browser-report-check.py || status=1
          python tests/editor-verification-browser.py || status=1
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-${{ matrix.browser }}
          path: .cache/editor-browser/
          retention-days: 14
