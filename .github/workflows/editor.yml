name: PDF editor preservation
on:
  push:
    branches: [main, fix/pdf-editor-preservation]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/locales/**'
      - 'tests/editor*'
      - '.github/workflows/editor.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Editor in ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check editor
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm run typecheck:selfhost
          pnpm run build:selfhost
          node tests/editor-preservation-smoke.mjs
      - name: Prepare browser
        run: |
          python -m pip install playwright==1.55.0 pymupdf==1.26.6
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Edit, undo, export, independently inspect and reopen
        env:
          MOINPDF_TEST_BROWSERS: ${{ matrix.browser }}
          MOINPDF_TEST_START_SERVER: '1'
        run: python tests/editor-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-${{ matrix.browser }}
          path: .cache/editor-browser/
          retention-days: 14
