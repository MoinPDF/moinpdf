name: WebKit Office follow-up
on:
  push:
    branches: ['qa/webkit-office-0.13.25']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    name: WebKit Office ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: webkit
            mode: persistent-offline
            persistent: '1'
            block: '1'
          - browser: webkit
            mode: private-online
            persistent: '0'
            block: '0'
    env:
      MOINPDF_BROWSER: ${{ matrix.browser }}
      MOINPDF_OFFICE_PERSISTENT: ${{ matrix.persistent }}
      MOINPDF_OFFICE_BLOCK_ASSETS: ${{ matrix.block }}
      MOINPDF_OFFICE_ABORT_CYCLES: '3'
      MOINPDF_TEST_URL: http://127.0.0.1:8765
      MOINPDF_DOCUMENTATION_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the released application without source changes
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm run typecheck:selfhost
          pnpm run build:selfhost
      - name: Install and record current browser test runtime
        run: |
          python -m pip install playwright pymupdf==1.28.2 python-docx==1.2.0 openpyxl==3.1.5 python-pptx==1.0.2 Pillow==11.3.0
          python -m playwright install --with-deps $MOINPDF_BROWSER
          mkdir -p cross-browser-evidence
          python -m pip freeze > cross-browser-evidence/runtime.txt
      - name: Start isolated local production build
        run: |
          python tests/cross-browser-server.py > "$RUNNER_TEMP/cross-browser-http.log" 2>&1 &
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8765/ -o /dev/null
      - name: Office cache capability and actual abort/restart conversions
        run: python tests/browser-office-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-office-${{ matrix.mode }}
          path: |
            cross-browser-evidence/
            web-evidence/
          retention-days: 30
