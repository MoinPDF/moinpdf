version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Match the seven-day package age required by pnpm-workspace.yaml.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directories: [/, /server, /docker/translation]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
