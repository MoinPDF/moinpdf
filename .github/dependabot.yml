version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Match the seven-day package age required by pnpm-workspace.yaml.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      compatible-updates:
        update-types: [minor, patch]
    ignore:
      # Docker and CI use Node 24; newer typings require a deliberate migration.
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pydantic-stack:
        patterns: ["pydantic", "pydantic-core"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directories: [/, /server, /docker/translation]
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Keep Docker and CI on Node 24 until a deliberate runtime migration.
      - dependency-name: node
        versions: [">=25"]
